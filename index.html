<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF VAT Table Generator</title>
    <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@4.0.379/build/pdf.min.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app-container">
        <!-- Top Navigation & Configuration Bar -->
        <header class="app-header">
            <div class="header-content">
                <h1 class="app-title">📄 PDF VAT Extractor</h1>
                <button id="settings-btn" class="btn-secondary">⚙️ Settings</button>
            </div>
        </header>

        <!-- Main Layout Grid -->
        <div class="app-layout">
            <!-- Control Sidebar -->
            <aside class="control-sidebar">
                <h2>Configuration</h2>
                <div class="config-section">
                    <label for="api-provider">AI Provider:</label>
                    <select id="api-provider">
                        <option value="openai">OpenAI</option>
                        <option value="anthropic">Anthropic Claude</option>
                        <option value="groq">Groq</option>
                        <option value="gemini">Google Gemini</option>
                    </select>
                </div>

                <div class="config-section">
                    <label for="api-key">API Key:</label>
                    <input type="password" id="api-key" placeholder="Enter your API key" class="masked-input">
                    <small>Stored locally in your browser only</small>
                </div>

                <div class="config-section">
                    <label for="model-id">Model ID:</label>
                    <input type="text" id="model-id" placeholder="e.g., gpt-4-vision" class="text-input">
                </div>

                <div class="config-section">
                    <label for="api-base-url">API Base URL (optional):</label>
                    <input type="text" id="api-base-url" placeholder="https://api.openai.com/v1" class="text-input">
                </div>

                <div class="config-section">
                    <label for="vat-rate">Default VAT Rate (%):</label>
                    <input type="number" id="vat-rate" placeholder="15" min="0" max="100" step="0.1" class="text-input">
                </div>

                <button id="save-config-btn" class="btn-primary">Save Configuration</button>
                <div id="config-status" class="status-message"></div>
            </aside>

            <!-- Main Content Area -->
            <main class="main-content">
                <!-- Upload Hub -->
                <section class="upload-section">
                    <div id="drop-zone" class="drop-zone">
                        <div class="drop-zone-content">
                            <p class="drop-icon">📤</p>
                            <p class="drop-text">Drag & drop your PDF or image here</p>
                            <p class="drop-subtext">or</p>
                            <button id="file-input-btn" class="btn-primary">Browse Files</button>
                            <input type="file" id="file-input" accept=".pdf,.jpg,.jpeg,.png,.gif" style="display: none;">
                        </div>
                    </div>
                </section>

                <!-- Processing Indicator -->
                <section id="processing-section" class="processing-section hidden">
                    <div class="spinner"></div>
                    <p id="processing-status">Processing document...</p>
                </section>

                <!-- Error Display -->
                <div id="error-display" class="error-box hidden">
                    <div class="error-header">
                        <span class="error-icon">⚠️</span>
                        <strong>Error</strong>
                        <button class="btn-close" onclick="document.getElementById('error-display').classList.add('hidden')">✕</button>
                    </div>
                    <div id="error-message" class="error-content"></div>
                    <textarea id="error-details" class="error-textarea hidden" readonly></textarea>
                    <div class="error-actions">
                        <button class="btn-secondary" onclick="document.getElementById('error-details').classList.toggle('hidden')">Show Details</button>
                    </div>
                </div>

                <!-- Data Grid Section -->
                <section id="grid-section" class="grid-section hidden">
                    <div class="grid-header">
                        <h2>Extracted Financial Data</h2>
                        <div class="grid-actions">
                            <button id="export-csv-btn" class="btn-primary">📥 Export as CSV</button>
                            <button id="clear-data-btn" class="btn-secondary">Clear</button>
                        </div>
                    </div>

                    <div class="grid-wrapper">
                        <table id="data-grid" class="data-table">
                            <thead>
                                <tr>
                                    <th>Index</th>
                                    <th>Date</th>
                                    <th>Description</th>
                                    <th>Qty</th>
                                    <th>Unit Price</th>
                                    <th>VAT Rate %</th>
                                    <th>VAT Amount</th>
                                    <th>Total (incl. VAT)</th>
                                    <th>Source Page</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="grid-body">
                                <!-- Populated by JavaScript -->
                            </tbody>
                        </table>
                    </div>

                    <div class="grid-summary">
                        <div class="summary-item">
                            <label>Total Items:</label>
                            <span id="summary-count">0</span>
                        </div>
                        <div class="summary-item">
                            <label>Total Before VAT:</label>
                            <span id="summary-subtotal">$0.00</span>
                        </div>
                        <div class="summary-item">
                            <label>Total VAT:</label>
                            <span id="summary-vat">$0.00</span>
                        </div>
                        <div class="summary-item highlight">
                            <label>Grand Total:</label>
                            <span id="summary-total">$0.00</span>
                        </div>
                    </div>
                </section>
            </main>
        </div>
    </div>

    <script src="lib/pdfjs-utils.js"></script>
    <script src="lib/ai-gateway.js"></script>
    <script src="lib/data-processor.js"></script>
    <script src="lib/ui-manager.js"></script>
    <script src="app.js"></script>
</body>
</html>
